name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The tests use their own SQLite database, and database.py no longer connects
    # on import, so CI doesn't need Postgres. DATABASE_URL just has to be set.
    env:
      DATABASE_URL: postgresql+psycopg2://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inventory-api .
